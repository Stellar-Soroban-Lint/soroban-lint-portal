name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The rule catalog, sample blurbs, and the parity gate all run the CLI.
      # `scripts/lib/soroban-lint-bin.mjs` downloads the pinned release asset and
      # verifies its published `.sha256` itself, so this job needs no Rust
      # toolchain and no hardcoded digest to keep in step with a release.
      - name: Generate the catalog, samples, and self-hosted Monaco
        run: npm run generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (includes the WASM-vs-CLI parity gate)
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The build that backs this job runs `npm run generate`, which fetches and
      # verifies the pinned release CLI on its own.

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the portal in a browser
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
