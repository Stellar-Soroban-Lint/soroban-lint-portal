name: soroban-lint action demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same findings as the failing demo, but fail-on: never keeps the step
      # green, and a low max-annotations shows the cap and its log message.
      # No SARIF upload here: code scanning would mark the check failed for the
      # error-level alerts, and this demo is about the passing fail-on outcome.
      - name: Run soroban-lint
        id: lint
        uses: Stellar-Soroban-Lint/soroban-lint-action@v0
        with:
          version: v0.1.2
          experimental: "true"
          fail-on: never
          max-annotations: "5"
