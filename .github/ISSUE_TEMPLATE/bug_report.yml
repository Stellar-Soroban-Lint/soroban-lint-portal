name: Bug report
description: Report a portal failure, incorrect display, or accessibility defect.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets or live third-party exploits. The linter aids review; it is not an audit.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include browser and version, sample source when safe, and what the portal displayed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
